<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a4f"/>
      <stop offset="1" stop-color="#1c5d99"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5d9a"/>
      <stop offset="1" stop-color="#0f2848"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b78b8"/>
      <stop offset="1" stop-color="#174d80"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <!-- the sun -->
  <g transform="translate(690 80)">
    <circle r="34" fill="#ffc83d"/>
    <g stroke="#ffc83d" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-48" x2="0" y2="-64"/><line x1="0" y1="48" x2="0" y2="64"/>
      <line x1="-48" y1="0" x2="-64" y2="0"/><line x1="48" y1="0" x2="64" y2="0"/>
      <line x1="34" y1="34" x2="45" y2="45"/><line x1="-34" y1="-34" x2="-45" y2="-45"/>
      <line x1="34" y1="-34" x2="45" y2="-45"/><line x1="-34" y1="34" x2="-45" y2="45"/>
    </g>
  </g>
  <!-- the sea and a boat -->
  <rect x="0" y="470" width="800" height="64" fill="url(#sea)"/>
  <path d="M0 470 q25 -10 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#9ec9ee" stroke-width="4"/>
  <g transform="translate(560 360)">
    <path d="M0 80 H200 L175 115 H25 Z" fill="#eef3f8"/>
    <rect x="96" y="-60" width="7" height="140" fill="#d9e2ec"/>
    <path d="M90 -55 L90 72 L20 72 Z" fill="#d9e2ec"/>
    <g transform="translate(110 30) skewX(-12)" fill="url(#cell)" stroke="#9ec9ee" stroke-width="2">
      <rect x="0" y="0" width="34" height="22"/><rect x="38" y="0" width="34" height="22"/>
    </g>
  </g>
  <!-- the inverter / charger -->
  <g transform="translate(70 270)">
    <rect x="0" y="0" width="150" height="190" rx="12" fill="#0b67c2"/>
    <rect x="18" y="20" width="114" height="54" rx="6" fill="#0d2a4f"/>
    <text x="75" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#7ee08a" text-anchor="middle">72 %</text>
    <circle cx="40" cy="110" r="9" fill="#7ee08a"/>
    <circle cx="75" cy="110" r="9" fill="#ffc83d"/>
    <circle cx="110" cy="110" r="9" fill="#9ec9ee"/>
    <rect x="18" y="140" width="114" height="10" rx="5" fill="#2b78b8"/>
    <rect x="18" y="160" width="80" height="10" rx="5" fill="#2b78b8"/>
  </g>
  <!-- the battery -->
  <g transform="translate(300 300)">
    <rect x="0" y="0" width="110" height="160" rx="14" fill="#eef3f8"/>
    <rect x="30" y="-14" width="50" height="16" rx="4" fill="#eef3f8"/>
    <rect x="13" y="48" width="84" height="98" rx="6" fill="#3ec27a"/>
    <path d="M60 62 L42 102 H56 L49 134 L72 94 H58 Z" fill="#ffffff"/>
  </g>
  <!-- the flows -->
  <g stroke="#ffc83d" stroke-width="6" fill="none" stroke-dasharray="14 10" stroke-linecap="round">
    <path d="M640 150 C560 210 470 250 420 330"/>
  </g>
  <g stroke="#7ee08a" stroke-width="6" fill="none" stroke-dasharray="14 10" stroke-linecap="round">
    <path d="M290 380 H230"/>
    <path d="M420 400 H550"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff">
    <text x="40" y="92" font-size="62" font-weight="bold">Victron VRM</text>
    <text x="42" y="140" font-size="28">for Gladys Assistant</text>
    <text x="42" y="180" font-size="20" fill="#cfe3f6">battery · solar · grid · alarms · forecasts</text>
  </g>
</svg>
